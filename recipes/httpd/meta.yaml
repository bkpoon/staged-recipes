{% set name = "httpd" %}
{% set version = "2.4.69" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://dlcdn.apache.org/httpd/{{ name }}-{{ version }}.tar.bz2
    sha256: c5e6ebc66e349b87d7fc6916ae7cc2a808ed348003de134cf9e9d89d3e2cc73d
    folder: httpd
  - url: https://dlcdn.apache.org//apr/apr-1.7.6.tar.bz2
    sha256: 49030d92d2575da735791b496dc322f3ce5cff9494779ba8cc28c7f46c5deb32
    folder: apr
  - url: https://dlcdn.apache.org//apr/apr-util-1.6.5.tar.bz2
    sha256: 96de1dd6f6a0476d2d2e7964926d8c1ddc3bb0e210e1b1812d3ba5a454a392e2
    folder: apr-util
  - url: https://github.com/GrahamDumpleton/mod_wsgi/releases/download/mod_wsgi-6.1.0/mod_wsgi-6.1.0.tar.gz
    sha256: 9ebb645c899ea6461edf27872c11a6a12c6e819edbcc3652e0b6195d990aa31c
    folder: wsgi

build:
  skip: true  # [not linux or py>311]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - libtool
    - make
    - perl
    - python
  host:
    - expat
    - libnghttp2
    - libsqlite
    - libuuid
    - libxcrypt
    - openssl
    - pcre2
    - perl
    - python
  run:
    - libexpat
    - libnghttp2
    - libsqlite
    - libuuid
    - libxcrypt
    - openssl
    - pcre2
    - python

    - django
    - latexcodec
    - mysql
    - postgresql
    - psycopg2
    - pybtex
    - pytz
    - requests

test:
  commands:
    - cp -a ${CONDA_PREFIX}/conf.orig ${CONDA_PREFIX}/conf; apachectl --help || true

about:
  home: https://httpd.apache.org
  summary: 'The Apache HTTP server project'
  description: |
    The Apache HTTP Server Project is an effort to develop and maintain an
    open-source HTTP server for modern operating systems including UNIX and
    Windows. The goal of this project is to provide a secure, efficient and
    extensible server that provides HTTP services in sync with the current
    HTTP standards.
    The Apache HTTP Server ("httpd") was launched in 1995 and it has been
    the most popular web server on the Internet since April 1996. It has
    celebrated its 25th birthday as a project in February 2020.
    The Apache HTTP Server is a project of The Apache Software Foundation.
  license: Apache-2.0
  license_family: Apache
  doc_url: https://httpd.apache.org/docs-project/
  dev_url: https://httpd.apache.org

extra:
  recipe-maintainers:
    - bkpoon
